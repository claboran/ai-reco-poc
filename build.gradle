plugins {
    id 'org.jetbrains.kotlin.jvm' version '2.0.21'
    id 'org.jetbrains.kotlin.plugin.spring' version '2.0.21'
    id 'org.springframework.boot' version '3.5.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.jetbrains.kotlin.plugin.jpa' version '2.0.21'
}

group = 'de.ecompiraten'
version = '0.0.2-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// Ensure all subprojects (like :openapi) also use JDK 21 toolchain
subprojects { subproj ->
    plugins.withId('java') {
        subproj.java {
            toolchain {
                languageVersion = JavaLanguageVersion.of(21)
            }
        }
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

ext {
    set('springBootVersion', "3.5.5")
}

dependencies {
    // Spring AI upgraded to GA
    implementation platform("org.springframework.ai:spring-ai-bom:1.0.1")
    implementation "org.springframework.ai:spring-ai-starter-model-ollama"
    implementation "org.springframework.ai:spring-ai-starter-vector-store-chroma"

    // Spring Boot
    implementation "org.springframework.boot:spring-boot-starter-data-jpa" // for later use
    implementation "org.springframework.boot:spring-boot-starter-web"
    developmentOnly "org.springframework.boot:spring-boot-devtools"
    testImplementation "org.springframework.boot:spring-boot-starter-test"
    annotationProcessor "org.springframework.boot:spring-boot-configuration-processor"

    // Kotlin
    implementation "org.jetbrains.kotlin:kotlin-reflect"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8"
    implementation "com.fasterxml.jackson.module:jackson-module-kotlin"

    // Testing
    testImplementation "org.jetbrains.kotlin:kotlin-test-junit5"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"

    //Misc
    implementation "org.postgresql:postgresql" // for later use
    implementation project(':openapi')
}

kotlin {
    compilerOptions {
        freeCompilerArgs.addAll '-Xjsr305=strict'
    }
}

allOpen {
    annotation 'jakarta.persistence.Entity'
    annotation 'jakarta.persistence.MappedSuperclass'
    annotation 'jakarta.persistence.Embeddable'
}

tasks.named('test') {
    useJUnitPlatform()
}
