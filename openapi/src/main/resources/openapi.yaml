openapi: 3.0.1
info:
  title: Product API
  version: 1.0.0

tags:
  - name: ProductRecommendation
  - name: Chat

paths:
  /api/products/recommend:
    post:  # Changed to POST
      summary: Recommend products
      operationId: getProductRecommendations
      tags: # Keep this tag here as well
        - ProductRecommendation
      requestBody:  # Added requestBody
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'  # Refer to a separate schema
      responses:
        '200':
          description: A list of recommended products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
        '400':  # Added Bad Request response
          description: Invalid request (e.g., missing query)
        '500': #Added Internal server error.
          description: Internal Server Error
  /api/chat:
    post:
      summary: Have a conversation with the AI assistant
      operationId: postChatMessage
      tags:
        - Chat
      requestBody:
        description: The conversation history and the new user query
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: The assistant's response and any recommended products
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '400':
          description: Invalid request (e.g., malformed history or missing query)
        '500':
          description: Internal Server Error

components:
  schemas:
    SearchRequest:  # New schema for the request body
      type: object
      properties:
        query:
          type: string
          description: The search query
          minLength: 1  # Enforce non-empty query
      required:
        - query  # Make the query field required

    Product:
      type: object
      properties:
        id:
          type: string
          format: uuid  # Validate as UUID
        description:
          type: string
        category:
          type: string
      required:  # Make all fields required
        - id
        - description
        - category

    ChatMessage:
      type: object
      description: A single message in the conversation history
      properties:
        role:
          type: string
          description: The role of the message sender
          enum: [user, assistant]
        content:
          type: string
          description: The text content of the message
      required:
        - role
        - content

    ChatRequest:
      type: object
      description: The payload for a new chat turn
      properties:
        history:
          type: array
          description: A list of previous messages in the conversation
          items:
            $ref: '#/components/schemas/ChatMessage'
        query:
          type: string
          description: The new message/question from the user
          minLength: 1
      required:
        - history
        - query

    ChatResponse:
      type: object
      description: The response from the AI assistant
      properties:
        answer:
          type: string
          description: The text response generated by the chatbot
        recommendedProducts:
          type: array
          description: A list of products recommended by the assistant, if any
          items:
            $ref: '#/components/schemas/Product'
      required:
        - answer
        - recommendedProducts
